<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<script>/* /test 처럼 끝에 / 없이 열리면 파일 경로가 어긋나므로 /test/ 로 보정 */
if(!/\/$|\.html$/.test(location.pathname))location.replace(location.pathname+'/'+location.search+location.hash)</script>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ff7fa8">
<title>모란 한 조각</title>
<meta name="description" content="모란 골목에 숨은 가게를 찾아 카드로 모으는 골목 탐험 게임">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="scene"></canvas>
<div id="stick"><i></i></div>
<div id="gmap" hidden><div id="gmapBody"></div><button id="gmRefresh" class="pill" data-act="gm-refresh" hidden>📍 지금 위치로 다시 보기</button></div>

<header class="hud">
  <div class="logo">🌸 모란 한 조각</div>
  <div class="hud-right">
    <span id="count" class="pill">🃏 0/0</span>
    <button id="gear" class="pill" aria-label="설정">⚙️</button>
  </div>
</header>
<div class="hud2">
  <button id="modeBtn" class="pill">🕹️ 둘러보기</button>
  <span id="gpsChip" class="pill soft" hidden></span>
  <button id="recenter" class="pill" hidden>🎯 내 위치</button>
</div>
<div class="hud3">
  <div class="viewtabs" role="tablist" aria-label="지도 보기">
    <button data-view="game" class="on">🎮 게임 지도</button>
    <button data-view="google">🗺️ 구글 지도</button>
  </div>
  <button class="pill reg" data-act="register">📍 가게 등록</button>
</div>
<div id="radar" class="radar">🍃 골목이 조용해요</div>
<div id="toast" role="status"></div>
<button id="actionBtn" class="action" hidden></button>
<p class="attrib"><span id="mapNote"></span> © OpenStreetMap contributors</p>

<div id="sheet" class="sheet">
  <button class="sheet-close" data-act="close-sheet" aria-label="닫기">✕</button>
  <div id="sheetBody"></div>
</div>

<nav class="tabbar">
  <button data-tab="map" class="on"><b>🗺️</b>골목</button>
  <button data-tab="album"><b>🃏</b>카드첩</button>
  <button data-tab="course"><b>💌</b>코스</button>
</nav>

<div id="modal" class="modal"></div>

<div id="splash">
  <div class="splash-box">
    <div class="petal">🌸</div>
    <h1>모란 한 조각</h1>
    <p>모란 골목에 숨은 가게를 찾아<br>나만의 카드로 모아보세요</p>
    <button class="btn" data-mode="gps" disabled>📍 GPS로 골목 탐험 시작</button>
    <button class="btn ghost" data-mode="explore" disabled>🕹️ 둘러보기 (어디서나 체험)</button>
    <small id="splashMsg">골목 지도를 펼치는 중…</small>
  </div>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
