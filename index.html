<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="3D 매장을 걸으며 키보드를 직접 타건해 보는 메이드키 온라인 타건샵">
<title>메이드키 타건샵</title>
<link rel="stylesheet" href="/src/style.css">
</head>
<body>
<div id="stage"></div>

<!-- 입장 화면 -->
<section id="entry" class="sheet">
  <div class="card">
    <p class="eyebrow">ONLINE TYPING SHOP</p>
    <h1>madekey</h1>
    <p class="lead">매장을 걸으며 키보드를 직접 타건해 보세요</p>
    <label for="nick">닉네임</label>
    <input id="nick" maxlength="12" autocomplete="off" placeholder="최대 12자">
    <span class="label">캐릭터 색</span>
    <div id="colors" class="chips" role="radiogroup" aria-label="캐릭터 색"></div>
    <button id="go" class="primary">입장하기</button>
  </div>
</section>

<!-- 매장 화면 -->
<div id="hud" hidden>
  <div class="top">
    <button id="roomBtn" class="pill" aria-haspopup="listbox" aria-expanded="false"><b id="roomName">1서버</b><span id="roomCnt">01/100</span></button>
    <div id="roomPop" class="pop" role="listbox" hidden></div>
    <button id="mute" class="pill" aria-pressed="false">소리 켜짐</button>
  </div>
  <p id="hint" class="hint">WASD·방향키 또는 바닥 클릭으로 이동 · 드래그로 둘러보기 · 휠로 확대/축소</p>
  <button id="prompt" class="prompt" hidden></button>
  <div id="typing" class="typing" hidden>
    <div>
      <b id="tyName"></b><span id="tySw"></span>
    </div>
    <div class="stat"><span>누른 키 <b id="tyCount">0</b></span><span>분당 <b id="tyRate">0</b>타</span></div>
    <button id="stand" class="pill">일어서기 <kbd>Esc</kbd></button>
  </div>
  <div id="toast" class="toast" hidden></div>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
